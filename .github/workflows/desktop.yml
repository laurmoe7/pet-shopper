name: Build the desktop app (Windows)

# Run it by hand: Actions > "Build the desktop app (Windows)" > Run workflow. The installer is under "Artifacts" on the run.
# Pushing a tag like desktop-v0.1.0 also attaches it to a release.
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Nibble-Windows-installer
          path: desktop/dist/*.exe
      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
