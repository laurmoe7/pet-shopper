name: Build the Android app

# Only by hand (Lauren asks for an APK; a push never builds one): Actions > "Build the Android app" > Run workflow.
# Publishes a pre-release (never the latest one: dev installs of the Windows app follow the latest release)
# with a debug-signed APK for testing on a phone. The app loads from the web, so only this folder
# (android/) needs a new APK.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    # the APK waits for Lauren's approval when the "release" environment has her as a required reviewer (desktop/README.md, "Releases need a click")
    environment: release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - name: Permissions (microphone, location, alerts on time)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />#' $M
          grep -n "uses-permission" $M
      - name: Home screen icon, start-up picture and alert icon
        # android/res (made by tools/android-icons.py, plus the alert icon) replaces the template's Capacitor logos
        run: cp -r res/. android/app/src/main/res/
      - run: npx cap sync android
      - name: Signing key (the same one every time, so a new APK installs over the old one)
        # ANDROID_DEBUG_KEYSTORE: the base64 of a keystore (alias androiddebugkey, passwords "android"), a repository secret.
        # The app's build.gradle is pointed at it (a key in ~/.android was not picked up on GitHub's machines); without the
        # secret Gradle makes a new key, and Android then refuses the APK as an update ("App not installed").
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::warning::No ANDROID_DEBUG_KEYSTORE secret: this APK will not install over an earlier one."; exit 0; fi
          K="$RUNNER_TEMP/fumu.keystore"
          echo "$KEYSTORE" | base64 -d > "$K"
          echo "FUMU_KEYSTORE=$K" >> "$GITHUB_ENV"
          printf '\nandroid {\n    signingConfigs {\n        debug {\n            storeFile file(System.getenv("FUMU_KEYSTORE"))\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }\n}\n' >> android/app/build.gradle
          tail -11 android/app/build.gradle
          keytool -list -keystore "$K" -storepass android -alias androiddebugkey | tail -1
      - name: Build the debug APK
        working-directory: android/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Check the APK carries that key
        if: env.FUMU_KEYSTORE != ''
        run: |
          want=$(keytool -list -v -keystore "$FUMU_KEYSTORE" -storepass android -alias androiddebugkey | grep -m1 'SHA256:' | awk '{print $2}')
          got=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -m1 'SHA256:' | awk '{print $2}')
          echo "key $want, APK $got"
          [ -n "$want" ] && [ "$want" = "$got" ] || { echo "::error::The APK is not signed with the ANDROID_DEBUG_KEYSTORE key; it would not install over the last one."; exit 1; }
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Fumufumu.apk
          TAG="android-${{ github.run_number }}"
          gh release create "$TAG" Fumufumu.apk --prerelease --latest=false --target "$GITHUB_SHA" --title "Android $TAG" --notes "Fumufumu for Android (debug build for testing)"
      - uses: actions/upload-artifact@v4
        with:
          name: Fumufumu-Android-apk
          path: android/Fumufumu.apk
