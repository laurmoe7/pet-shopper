<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;height:100%;overflow:hidden;background:transparent}canvas{position:absolute;left:0;top:0;display:block}#c{transition:opacity 1.1s ease-out}#c.fade{opacity:0}</style>
<canvas id="c"></canvas><canvas id="s"></canvas>
<script>
// The wrecking ball's overlay: a see-through window over the whole screen that never takes a click. Where the ball hits a window it draws cracks in the
// glass (once, on a still layer: nothing is redrawn until something moves) and a few small shards that fall; later the cracks fade away with sparkles.
// The shell only tells it where the windows are; it never sees what is in them, and nothing here touches the real windows.
'use strict';
var cv = document.getElementById('c'), g = cv.getContext('2d'), sv = document.getElementById('s'), sg = sv.getContext('2d');
var W = 0, H = 0, wins = [], hits = [], shards = [], sparks = [], raf = 0, last = 0, scale = 1;
function rnd(a, b) { return a + Math.random() * (b - a); }

/** Sets the size and the windows: each is {x, y, w, h, cols, rows} (px of this overlay). */
function init(w, h, list) {
  W = w; H = h; hits = []; shards = []; sparks = [];
  scale = Math.min(1, 1280 / W);   // (a see-through picture over the whole screen: drawn smaller and scaled up, it costs the PC far less)
  [cv, sv].forEach(function (c) { c.width = Math.round(W * scale); c.height = Math.round(H * scale); c.style.width = W + 'px'; c.style.height = H + 'px'; });
  g.setTransform(scale, 0, 0, scale, 0, 0); sg.setTransform(scale, 0, 0, scale, 0, 0);
  g.clearRect(0, 0, W, H); cv.classList.remove('fade'); cv.style.opacity = 1;
  wins = (list || []).map(function (r) { return { r: r, broke: {} }; });
}

/** A crack from (x, y): rays that bend, with a few branches, and a ring or two round the point. */
function crack(x, y, size) {
  var n = 8 + (Math.random() * 4 | 0), i, j, a, px, py, len, nx, ny;
  g.lineCap = 'round'; g.lineJoin = 'round';
  var haze = g.createRadialGradient(x, y, 0, x, y, size * .8);
  haze.addColorStop(0, 'rgba(255,255,255,.22)'); haze.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = haze; g.beginPath(); g.arc(x, y, size * .8, 0, 7); g.fill();
  var paths = [];
  for (i = 0; i < n; i++) {
    a = i / n * Math.PI * 2 + rnd(-.25, .25); len = size * rnd(.45, 1.05); px = x; py = y;
    var pts = [[x, y]], steps = 3 + (Math.random() * 2 | 0);
    for (j = 1; j <= steps; j++) {
      a += rnd(-.35, .35); nx = px + Math.cos(a) * len / steps; ny = py + Math.sin(a) * len / steps; pts.push([nx, ny]);
      if (Math.random() < .35) { var b = a + (Math.random() < .5 ? -1 : 1) * rnd(.5, 1); paths.push([[nx, ny], [nx + Math.cos(b) * len * .28, ny + Math.sin(b) * len * .28]]); }
      px = nx; py = ny;
    }
    paths.push(pts);
  }
  for (j = 0; j < 2; j++) {   // rings
    var rr = size * (.14 + j * .17), seg = [], k0 = Math.random() * 6;
    for (i = 0; i <= 9; i++) { var ang = k0 + i / 9 * (Math.PI * 1.4); seg.push([x + Math.cos(ang) * rr * rnd(.85, 1.15), y + Math.sin(ang) * rr * rnd(.85, 1.15)]); }
    paths.push(seg);
  }
  [['rgba(8,8,16,.7)', 2.2], ['rgba(255,255,255,.55)', .8]].forEach(function (st, pass) {
    g.strokeStyle = st[0]; g.lineWidth = st[1];
    paths.forEach(function (p) { g.beginPath(); g.moveTo(p[0][0] + pass * .8, p[0][1] + pass * .8); for (var m = 1; m < p.length; m++) g.lineTo(p[m][0] + pass * .8, p[m][1] + pass * .8); g.stroke(); });
  });
  g.fillStyle = 'rgba(10,10,18,.8)'; g.beginPath();   // the chip at the point of impact
  for (i = 0; i < 7; i++) { var ca = i / 7 * Math.PI * 2, cr = rnd(4, 9); g.lineTo(x + Math.cos(ca) * cr, y + Math.sin(ca) * cr); }
  g.closePath(); g.fill();
}

/** One piece (cell k) of window i was hit where the ball was (ix, iy): the glass cracks there and a few shards fall. */
function hit(i, k, ix, iy) {
  var w = wins[i];
  if (!w || w.broke[k]) return;
  w.broke[k] = 1;
  var r = w.r, size = Math.max(60, Math.min(r.w / r.cols, r.h / r.rows) * 1.1);
  g.save();
  g.beginPath(); g.rect(r.x, r.y, r.w, r.h);   // (cracks stay inside the window, and off the windows in front of it)
  for (var q = 0; q < i; q++) g.rect(wins[q].r.x, wins[q].r.y, wins[q].r.w, wins[q].r.h);
  g.clip('evenodd');
  crack(ix, iy, size);
  g.restore();
  hits.push({ x: ix, y: iy });
  for (var s = 0; s < 5; s++) shards.push({ x: ix + rnd(-12, 12), y: iy + rnd(-12, 12), vx: rnd(-160, 160), vy: rnd(-220, -40), rot: rnd(0, 6), vr: rnd(-6, 6), s: rnd(4, 9), t: 0 });
  if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
}

/** The glass is whole again: the cracks fade and a sparkle pops at each place that was hit. */
function fix() {
  cv.classList.add('fade');
  hits.forEach(function (h, n) { sparks.push({ x: h.x, y: h.y, t: -n * .03 }); });
  if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
}

function star(x, y, s, alpha) {
  sg.save(); sg.translate(x, y); sg.globalAlpha = alpha; sg.fillStyle = '#ffe27a';
  sg.beginPath();
  for (var k = 0; k < 8; k++) { var rr = k % 2 ? s * .35 : s, an = k * Math.PI / 4 - Math.PI / 2; sg.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); }
  sg.closePath(); sg.fill(); sg.restore();
}

function frame(ts) {
  var dt = Math.min(.05, (ts - last) / 1000); last = ts;
  sg.clearRect(0, 0, W, H);
  shards = shards.filter(function (p) {
    p.t += dt; p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.t > 1.3 || p.y > H + 40) return false;
    sg.save(); sg.translate(p.x, p.y); sg.rotate(p.rot); sg.globalAlpha = Math.min(1, (1.3 - p.t) * 2);
    sg.fillStyle = 'rgba(214,228,244,.9)'; sg.beginPath(); sg.moveTo(0, -p.s); sg.lineTo(p.s * .8, p.s * .6); sg.lineTo(-p.s * .7, p.s * .5); sg.closePath(); sg.fill();
    sg.restore();
    return true;
  });
  sparks = sparks.filter(function (s) { s.t += dt; return s.t < .6; });
  sparks.forEach(function (s) { if (s.t > 0) star(s.x, s.y - s.t * 40, 5 + 8 * (1 - Math.abs(s.t / .3 - 1)), Math.max(0, 1 - s.t / .6)); });
  raf = shards.length || sparks.length ? requestAnimationFrame(frame) : 0;   // (nothing moving: nothing is drawn)
}
window.wreck = { init: init, hit: hit, fix: fix };
</script>
