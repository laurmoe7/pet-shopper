<!doctype html>
<meta charset="utf-8">
<title>Fumufumu</title>
<style>
/* the loading card shown while the window waits for the page (the page shows the same card from its first paint: see #boot in index.html) */
html,body{margin:0;height:100%;overflow:hidden;background:transparent}
#boot{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity .35s ease}
#boot.out{opacity:0}
#boot .card{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 30px;border-radius:26px;background:#fdf1f3;color:#7a4b4b;border:2px solid #f3c6cf;box-shadow:0 8px 28px rgba(122,75,75,.18);font:800 18px/1.1 "M PLUS Rounded 1c","Kiwi Maru",system-ui,sans-serif}
#boot .blob{width:54px;height:46px;border-radius:50% 50% 46% 46%;background:#f4f1ee;border:2.5px solid #7a4b4b;position:relative;animation:bootHop 1s ease-in-out infinite;transform-origin:50% 100%}
#boot .blob:before,#boot .blob:after{content:"";position:absolute;top:18px;width:6px;height:8px;border-radius:50%;background:#7a4b4b;left:15px}
#boot .blob:after{left:auto;right:15px}
#boot .shadow{width:40px;height:7px;border-radius:50%;background:rgba(122,75,75,.18);margin-top:-6px;animation:bootShadow 1s ease-in-out infinite}
#boot .dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:#e7819a;animation:bootDot 1s ease-in-out infinite}
#boot .dots i:nth-child(2){animation-delay:.15s}#boot .dots i:nth-child(3){animation-delay:.3s}
#boot small{font-size:13px;font-weight:700;opacity:.75;display:flex;align-items:center;gap:6px}
@keyframes bootHop{0%,100%{transform:translateY(0) scale(1.1,.88)}45%{transform:translateY(-16px) scale(.92,1.1)}}
@keyframes bootShadow{0%,100%{transform:scale(1);opacity:1}45%{transform:scale(.6);opacity:.5}}
@keyframes bootDot{0%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-5px);opacity:1}}
@media (prefers-color-scheme:dark){#boot .card{background:#2b2326;color:#f3dfe3;border-color:#5a4249}#boot .blob{background:#d9d3d0;border-color:#f3dfe3}}
@media (prefers-reduced-motion:reduce){#boot *{animation-duration:3s!important}}
</style>
<div id="boot"><div class="card"><div class="blob"></div><div class="shadow"></div><div>Fumufumu</div><small>Loading <span class="dots"><i></i><i></i><i></i></span></small></div></div>
