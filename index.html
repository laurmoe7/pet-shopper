<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nibble's List</title>
<meta name="description" content="A grocery list with a little pet who eats what you check off.">
<meta name="theme-color" content="#fdf1f3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="scene" id="scene">
    <div class="scene-bar">
      <h1 class="brand">Nibble<span class="brand-sub">'s list</span><span class="brand-jp" lang="ja" title="mogu mogu: munch munch">もぐもぐ</span></h1>
      <div class="scene-tools">
        <span class="tally" id="tally" aria-live="polite"></span>
        <button class="pill-btn" id="quietBtn" type="button" aria-pressed="false" title="Quiet mode: no sounds or speech bubbles">Quiet</button>
      </div>
    </div>

    <div class="stage">
      <div class="bubble" id="bubble" role="status" aria-live="polite" hidden></div>
      <div class="pet" id="pet" data-state="sleepy" aria-label="Nibble, your pet">
        <svg viewBox="0 0 160 150" class="pet-svg" aria-hidden="true">
          <defs>
            <!-- a slight wobble so the lines look drawn by hand -->
            <filter id="handdrawn" x="-10%" y="-10%" width="120%" height="120%">
              <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/>
              <feDisplacementMap in="SourceGraphic" scale="2.4"/>
            </filter>
            <radialGradient id="mochi" cx="45%" cy="35%" r="75%">
              <stop offset="0" style="stop-color: var(--pet-skin-hi)"/>
              <stop offset="1" style="stop-color: var(--pet-skin)"/>
            </radialGradient>
          </defs>
          <g class="pet-body" filter="url(#handdrawn)">
            <ellipse class="foot" cx="58" cy="137" rx="11" ry="6"/>
            <ellipse class="foot" cx="102" cy="137" rx="11" ry="6"/>
            <g class="squish">
              <ellipse class="arm arm-l" cx="20" cy="110" rx="7" ry="9"/>
              <ellipse class="arm arm-r" cx="140" cy="110" rx="7" ry="9"/>
              <path class="skin" d="M80 38 C124 38 147 70 147 102 C147 129 119 139 80 139 C41 139 13 129 13 102 C13 70 36 38 80 38 Z"/>
              <!-- the little twist on top, where the mochi was pinched closed -->
              <path class="twist" d="M73 40 C74 31 80 27 86 30 C82 32 81 36 84 40"/>
              <ellipse class="redface" cx="80" cy="100" rx="56" ry="32"/>
              <g class="cheeks">
                <ellipse class="cheek" cx="40" cy="106" rx="11" ry="6"/>
                <ellipse class="cheek" cx="120" cy="106" rx="11" ry="6"/>
                <path class="hatch" d="M34 108 l4 -6 M40 108 l4 -6 M46 108 l4 -6 M114 108 l4 -6 M120 108 l4 -6 M126 108 l4 -6"/>
              </g>

              <g data-eyes="open" class="eyes-open">
                <g class="pupils">
                  <ellipse cx="58" cy="92" rx="4.6" ry="5.2" class="ink"/>
                  <ellipse cx="102" cy="92" rx="4.6" ry="5.2" class="ink"/>
                  <circle cx="56.6" cy="90" r="1.6" class="glint"/>
                  <circle cx="100.6" cy="90" r="1.6" class="glint"/>
                </g>
              </g>
              <g data-eyes="closed" class="line">
                <path d="M52 92 Q58 97 64 92"/>
                <path d="M96 92 Q102 97 108 92"/>
              </g>
              <g data-eyes="happy" class="line">
                <path d="M52 95 Q58 87 64 95"/>
                <path d="M96 95 Q102 87 108 95"/>
              </g>
              <g data-eyes="sparkle" class="star">
                <path d="M58 83 L60 89.5 L66 92 L60 94.5 L58 101 L56 94.5 L50 92 L56 89.5Z"/>
                <path d="M102 83 L104 89.5 L110 92 L104 94.5 L102 101 L100 94.5 L94 92 L100 89.5Z"/>
              </g>
              <g data-eyes="squint" class="line">
                <path d="M53 87 L63 92 L53 97"/>
                <path d="M107 87 L97 92 L107 97"/>
              </g>
              <g data-eyes="teary">
                <ellipse cx="58" cy="92" rx="5.4" ry="6" class="ink"/>
                <ellipse cx="102" cy="92" rx="5.4" ry="6" class="ink"/>
                <circle cx="56" cy="89.5" r="2.4" class="glint"/>
                <circle cx="100" cy="89.5" r="2.4" class="glint"/>
                <circle cx="60" cy="94.5" r="1.1" class="glint"/>
                <circle cx="104" cy="94.5" r="1.1" class="glint"/>
                <path class="tear" d="M52 99 q-3 6 0 8 q3 -2 0 -8z"/>
                <path class="tear" d="M108 99 q-3 6 0 8 q3 -2 0 -8z"/>
              </g>
              <g data-eyes="confused">
                <ellipse cx="58" cy="92" rx="4.6" ry="5.2" class="ink"/>
                <circle cx="56.6" cy="90" r="1.6" class="glint"/>
                <path class="line" d="M96 92 L108 92"/>
              </g>

              <path data-mouth="smile" class="line" d="M75 103 Q80 108 85 103"/>
              <g data-mouth="open">
                <path d="M73 102 Q80 101 87 102 Q87 113 80 113 Q73 113 73 102Z" class="mouth-in"/>
                <ellipse cx="80" cy="110" rx="3.6" ry="2.4" class="tongue"/>
              </g>
              <path data-mouth="chew" class="line chew" d="M73 105 q3.5 -3.5 7 0 q3.5 3.5 7 0"/>
              <path data-mouth="wavy" class="line" d="M71 106 q3 -3 6 0 q3 3 6 0 q3 -3 6 0"/>
              <ellipse data-mouth="o" cx="80" cy="105" rx="2.6" ry="3" class="mouth-in"/>
            </g>
          </g>

          <g data-extra="zzz" class="zzz">
            <text x="118" y="50">z</text><text x="128" y="38" class="z2">z</text><text x="137" y="28" class="z3">z</text>
          </g>
          <g data-extra="zzz" class="nose-bubble"><circle cx="93" cy="101" r="6"/></g>
          <g data-extra="steam" class="steam">
            <path d="M56 32 q-5 -5 0 -10 q5 -5 0 -10"/>
            <path d="M104 32 q-5 -5 0 -10 q5 -5 0 -10"/>
            <path d="M80 22 q-5 -5 0 -10 q5 -5 0 -10"/>
          </g>
          <g data-extra="hearts" class="hearts">
            <path d="M22 52 c-3 -5 -10 -2 -7 3 l7 7 l7 -7 c3 -5 -4 -8 -7 -3z"/>
            <path d="M139 46 c-2.5 -4 -8 -1.5 -5.5 2.5 l5.5 5.5 l5.5 -5.5 c2.5 -4 -3 -6.5 -5.5 -2.5z"/>
          </g>
          <g data-extra="sparkles" class="sparkles">
            <path d="M24 66 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2z"/>
            <path d="M138 64 l1.6 4 l4 1.6 l-4 1.6 l-1.6 4 l-1.6 -4 l-4 -1.6 l4 -1.6z"/>
            <path d="M120 30 l1.3 3.2 l3.2 1.3 l-3.2 1.3 l-1.3 3.2 l-1.3 -3.2 l-3.2 -1.3 l3.2 -1.3z"/>
          </g>
          <g data-extra="question" class="question"><text x="126" y="56">?</text></g>
          <g data-extra="sweat" class="sweat"><path d="M131 62 q-6 10 0 14 q6 -4 0 -14z"/></g>
          <g data-extra="shock" class="shock line"><path d="M30 44 l6 8 M24 56 l9 3 M130 44 l-6 8 M136 56 l-9 3"/></g>
        </svg>
        <div class="tummy" id="tummy" aria-hidden="true"></div>
      </div>
      <div class="cushion" aria-hidden="true"></div>
    </div>
  </header>

  <main class="list-area">
    <form class="add" id="addForm" autocomplete="off">
      <label class="visually-hidden" for="addInput">Add an item</label>
      <input id="addInput" name="item" type="text" placeholder="Add an item, like bananas" enterkeyhint="done" maxlength="80">
      <span class="add-preview" id="addPreview" aria-hidden="true"></span>
      <button type="submit" class="add-btn" aria-label="Add item">Add</button>
    </form>

    <ul class="items" id="todo" aria-label="To buy"></ul>
    <p class="empty" id="emptyHint">Nibble is napping. Add something to the list and it will wake up.</p>

    <section class="eaten" id="eatenSection" hidden>
      <div class="eaten-head">
        <h2>Eaten <span id="eatenCount" class="count"></span></h2>
        <button type="button" class="text-btn" id="clearBtn">Clear eaten</button>
      </div>
      <ul class="items" id="done" aria-label="Eaten"></ul>
    </section>

    <p class="hint">Tap an item's emoji, or long-press the item, to pick a different one.</p>
    <p class="credit">Emoji by <a href="https://openmoji.org/" target="_blank" rel="noopener">OpenMoji</a>, CC BY-SA 4.0</p>
  </main>
</div>

<dialog class="picker" id="picker" aria-labelledby="pickerTitle">
  <form method="dialog" class="picker-inner">
    <h2 id="pickerTitle">Pick an emoji for <span id="pickerName"></span></h2>
    <div class="picker-grid" id="pickerGrid"></div>
    <div class="picker-foot">
      <button type="button" class="text-btn danger" id="deleteBtn">Delete item</button>
      <button value="cancel" class="text-btn">Close</button>
    </div>
  </form>
</dialog>

<script src="foods.js"></script>
<script src="sounds.js"></script>
<script src="app.js"></script>
</body>
</html>
